<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Supermercado</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#f4f6f8;
  color:#1f2937;
}

.container{
  width:100%;
  max-width:700px;
  margin:0 auto;
  padding:16px;
  padding-bottom:110px;
}

h1{
  margin:5px 0 18px;
  font-size:27px;
  text-align:center;
}

h2{
  font-size:20px;
  margin:22px 0 12px;
}

.card{
  background:white;
  border-radius:16px;
  padding:16px;
  margin-bottom:15px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}

label{
  display:block;
  font-size:14px;
  font-weight:600;
  margin-bottom:6px;
}

select,
input{
  width:100%;
  height:48px;
  border:1px solid #d1d5db;
  border-radius:10px;
  padding:0 13px;
  font-size:16px;
  background:white;
}

.row{
  display:flex;
  gap:8px;
  align-items:center;
}

.row select{
  flex:1;
  min-width:0;
}

.row > button.small{
  flex:0 0 46px;
  width:46px;
  min-width:46px;
  height:46px;
  padding:0;
  border-radius:10px;
  font-size:25px;
}

button{
  border:0;
  border-radius:11px;
  min-height:46px;
  padding:0 16px;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.primary{
  width:100%;
  background:#111827;
  color:white;
}

.secondary{
  background:#e5e7eb;
  color:#111827;
}

.danger{
  background:#fee2e2;
  color:#b91c1c;
}

.success{
  background:#16a34a;
  color:white;
}

#scannerArea{
  display:none;
  margin-top:15px;
}

#reader{
  width:100%;
  overflow:hidden;
  border-radius:14px;
  background:#111;
}

#reader video{
  width:100% !important;
  height:auto !important;
  border-radius:14px;
}

#status{
  text-align:center;
  font-size:14px;
  color:#6b7280;
  margin:10px 0;
  min-height:20px;
}

.product-info{
  background:#f8fafc;
  border-radius:12px;
  padding:14px;
  margin-top:14px;
}

.product-name{
  font-size:19px;
  font-weight:700;
  margin-bottom:12px;
}

.price-label{
  font-size:14px;
  font-weight:600;
  margin-bottom:6px;
}

.price-input{
  font-size:24px;
  font-weight:750;
  height:54px;
}

.barcode{
  color:#6b7280;
  font-size:13px;
  margin-top:8px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:13px 0;
  border-bottom:1px solid #e5e7eb;
}

.cart-item:last-child{
  border-bottom:0;
}

.cart-left{
  flex:1;
  min-width:0;
}

.cart-name{
  font-weight:650;
  line-height:1.25;
}

.cart-price{
  color:#6b7280;
  font-size:14px;
  margin-top:4px;
}

.cart-right{
  text-align:right;
  min-width:105px;
}

.subtotal{
  font-weight:750;
}

.qty{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:7px;
  margin-top:6px;
}

.qty button{
  width:30px;
  min-width:30px;
  height:30px;
  min-height:30px;
  padding:0;
  border-radius:8px;
  background:#e5e7eb;
  font-size:18px;
}

.qty span{
  min-width:20px;
  text-align:center;
  font-weight:700;
}

.empty{
  text-align:center;
  color:#6b7280;
  padding:18px 5px;
}

.total-bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  border-top:1px solid #e5e7eb;
  box-shadow:0 -3px 15px rgba(0,0,0,.08);
  padding:12px 16px;
  z-index:100;
}

.total-inner{
  width:100%;
  max-width:700px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.total-label{
  font-size:14px;
  color:#6b7280;
}

.total-value{
  font-size:26px;
  font-weight:850;
}

.total-bar button{
  min-width:150px;
}

.history-item{
  padding:13px 0;
  border-bottom:1px solid #e5e7eb;
}

.history-item:last-child{
  border-bottom:0;
}

.history-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.history-date{
  font-weight:650;
}

.history-total{
  font-weight:800;
}

.history-market{
  font-size:14px;
  color:#6b7280;
  margin-top:4px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:200;
  padding:20px;
  align-items:center;
  justify-content:center;
}

.modal-box{
  width:100%;
  max-width:500px;
  background:white;
  border-radius:18px;
  padding:20px;
  max-height:90vh;
  overflow:auto;
}

.modal-title{
  font-size:21px;
  font-weight:800;
  margin-bottom:16px;
}

.field{
  margin-bottom:15px;
}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:18px;
}

.modal-actions button{
  flex:1;
}

.notice{
  font-size:13px;
  color:#6b7280;
  line-height:1.45;
  margin-top:8px;
}

.hidden{
  display:none !important;
}

</style>

</head>

<body>

<div class="container">

  <h1>🛒 Supermercado</h1>


  <!-- SUPERMERCADO -->

  <div class="card">

    <label for="supermercado">
      Supermercado
    </label>

    <div class="row">

      <select id="supermercado">

        <option value="">
          Selecione o supermercado
        </option>

      </select>

      <button
        class="secondary small"
        onclick="abrirModalSupermercado()"
        title="Adicionar supermercado"
      >
        +
      </button>

    </div>

  </div>


  <!-- SCANNER -->

  <div class="card">

    <button
      id="scanButton"
      class="primary"
      onclick="abrirScanner()"
    >
      📷 Escanear produto
    </button>


    <div id="scannerArea">

      <div id="reader"></div>

      <div id="status">
        Abrindo câmera...
      </div>

      <button
        class="secondary"
        style="width:100%;"
        onclick="fecharScanner()"
      >
        Fechar câmera
      </button>

    </div>

  </div>


  <!-- PRODUTO -->

  <div
    id="produtoCard"
    class="card hidden"
  >

    <div class="product-info">

      <div
        id="produtoNome"
        class="product-name"
      ></div>


      <div class="price-label">
        Preço neste supermercado
      </div>


      <input
        id="produtoPreco"
        class="price-input"
        type="number"
        inputmode="decimal"
        step="0.01"
        min="0"
        placeholder="0,00"
      >


      <div
        id="produtoCodigo"
        class="barcode"
      ></div>

    </div>


    <button
      id="adicionarProdutoButton"
      class="success"
      style="width:100%;margin-top:12px;"
      onclick="salvarPrecoEAdicionar()"
    >
      Salvar preço e adicionar ao carrinho
    </button>

  </div>


  <!-- CARRINHO -->

  <div class="card">

    <h2>🛒 Carrinho</h2>

    <div id="carrinho">

      <div class="empty">
        Nenhum produto adicionado.
      </div>

    </div>

    <button
      id="limparCarrinhoButton"
      class="danger"
      style="width:100%;margin-top:12px;display:none;"
      onclick="limparCarrinho()"
    >
      Limpar carrinho
    </button>

  </div>


  <!-- HISTÓRICO -->

  <div class="card">

    <h2>📋 Histórico de compras</h2>

    <div id="historico">

      <div class="empty">
        Carregando...
      </div>

    </div>

  </div>

</div>


<!-- TOTAL -->

<div class="total-bar">

  <div class="total-inner">

    <div>

      <div class="total-label">
        Total da compra
      </div>

      <div
        id="total"
        class="total-value"
      >
        R$ 0,00
      </div>

    </div>

    <button
      id="finalizarButton"
      class="success"
      onclick="finalizarCompra()"
      disabled
    >
      Finalizar compra
    </button>

  </div>

</div>


<!-- MODAL NOVO PRODUTO -->

<div
  id="produtoModal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-title">
      Produto não cadastrado
    </div>

    <div class="notice">
      Este código de barras ainda não está cadastrado.
      Informe os dados do produto.
    </div>


    <div class="field">

      <label>
        Código de barras
      </label>

      <input
        id="novoProdutoCodigo"
        type="text"
        readonly
      >

    </div>


    <div class="field">

      <label for="novoProdutoNome">
        Nome do produto
      </label>

      <input
        id="novoProdutoNome"
        type="text"
        placeholder="Ex.: Coca-Cola 350ml"
      >

    </div>


    <div class="field">

      <label for="novoProdutoPreco">
        Preço
      </label>

      <input
        id="novoProdutoPreco"
        type="number"
        inputmode="decimal"
        step="0.01"
        min="0"
        placeholder="0,00"
      >

    </div>


    <div class="modal-actions">

      <button
        class="secondary"
        onclick="fecharModalProduto()"
      >
        Cancelar
      </button>

      <button
        class="success"
        onclick="cadastrarProduto()"
      >
        Cadastrar
      </button>

    </div>

  </div>

</div>


<!-- MODAL SUPERMERCADO -->

<div
  id="supermercadoModal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-title">
      Novo supermercado
    </div>


    <div class="field">

      <label for="novoSupermercadoNome">
        Nome
      </label>

      <input
        id="novoSupermercadoNome"
        type="text"
        placeholder="Ex.: Carone"
      >

    </div>


    <div class="modal-actions">

      <button
        class="secondary"
        onclick="fecharModalSupermercado()"
      >
        Cancelar
      </button>

      <button
        class="success"
        onclick="cadastrarSupermercado()"
      >
        Adicionar
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://lbehdmxfkakwygwoozyr.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_wJXFi-54JwNO9RIm8NZU_Q_-9bt7S7h";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   VARIÁVEIS
========================================================= */

let scanner = null;

let scannerRodando = false;

let produtoAtual = null;

let supermercadoAtual = null;

let carrinho = [];

const STORAGE_CARRINHO =
  "supermercado_carrinho_v1";

const STORAGE_DATA =
  "supermercado_carrinho_criado_em";

const STORAGE_SUPERMERCADO =
  "supermercado_selecionado";

const STORAGE_HORAS = 12;


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  async function(){

    await carregarSupermercados();

    restaurarCarrinho();

    await carregarHistorico();

  }
);


/* =========================================================
   SUPERMERCADOS
========================================================= */

async function carregarSupermercados(){

  const select =
    document.getElementById(
      "supermercado"
    );


  select.innerHTML =
    '<option value="">Selecione o supermercado</option>';


  const {
    data,
    error
  } =
    await supabaseClient
      .from("supermercados")
      .select("*")
      .order("nome");


  if(error){

    console.error(error);

    alert(
      "Não foi possível carregar os supermercados."
    );

    return;

  }


  data.forEach(
    function(supermercado){

      const option =
        document.createElement(
          "option"
        );

      option.value =
        supermercado.id;

      option.textContent =
        supermercado.nome;

      select.appendChild(option);

    }
  );


  const supermercadoSalvo =
    localStorage.getItem(
      STORAGE_SUPERMERCADO
    );


  if(supermercadoSalvo){

    const existe =
      [...select.options].some(
        option =>
          option.value ===
          supermercadoSalvo
      );


    if(existe){

      select.value =
        supermercadoSalvo;

      supermercadoAtual =
        Number(
          supermercadoSalvo
        );

    }

  }


  select.addEventListener(
    "change",
    trocarSupermercado
  );

}


/* =========================================================
   TROCAR SUPERMERCADO
========================================================= */

function trocarSupermercado(){

  const novo =
    document.getElementById(
      "supermercado"
    ).value;


  if(!novo){

    supermercadoAtual = null;

    localStorage.removeItem(
      STORAGE_SUPERMERCADO
    );

    return;

  }


  if(
    carrinho.length > 0 &&
    supermercadoAtual &&
    Number(novo) !==
    Number(supermercadoAtual)
  ){

    const confirmar =
      confirm(
        "Existe uma compra em andamento neste carrinho.\n\n" +
        "Se você trocar de supermercado, o carrinho atual será apagado.\n\n" +
        "Deseja continuar?"
      );


    if(!confirmar){

      document.getElementById(
        "supermercado"
      ).value =
        supermercadoAtual;

      return;

    }


    limparCarrinhoSilencioso();

  }


  supermercadoAtual =
    Number(novo);


  localStorage.setItem(
    STORAGE_SUPERMERCADO,
    novo
  );


  produtoAtual = null;

  esconderProduto();

}


/* =========================================================
   NOVO SUPERMERCADO
========================================================= */

function abrirModalSupermercado(){

  document.getElementById(
    "novoSupermercadoNome"
  ).value = "";


  document.getElementById(
    "supermercadoModal"
  ).style.display =
    "flex";

}


function fecharModalSupermercado(){

  document.getElementById(
    "supermercadoModal"
  ).style.display =
    "none";

}


async function cadastrarSupermercado(){

  const nome =
    document.getElementById(
      "novoSupermercadoNome"
    ).value.trim();


  if(!nome){

    alert(
      "Digite o nome do supermercado."
    );

    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("supermercados")
      .insert({
        nome: nome
      })
      .select()
      .single();


  if(error){

    console.error(error);


    if(error.code === "23505"){

      alert(
        "Esse supermercado já está cadastrado."
      );

    }else{

      alert(
        "Não foi possível cadastrar o supermercado."
      );

    }

    return;

  }


  fecharModalSupermercado();

  await carregarSupermercados();


  document.getElementById(
    "supermercado"
  ).value =
    data.id;


  supermercadoAtual =
    Number(data.id);


  localStorage.setItem(
    STORAGE_SUPERMERCADO,
    data.id
  );

}


/* =========================================================
   SCANNER
========================================================= */

async function abrirScanner(){

  if(scannerRodando){

    return;

  }


  const supermercado =
    document.getElementById(
      "supermercado"
    ).value;


  if(!supermercado){

    alert(
      "Selecione um supermercado primeiro."
    );

    return;

  }


  document.getElementById(
    "scannerArea"
  ).style.display =
    "block";


  document.getElementById(
    "scanButton"
  ).style.display =
    "none";


  document.getElementById(
    "status"
  ).textContent =
    "Abrindo câmera...";


  scanner =
    new Html5Qrcode("reader");


  try{

    await scanner.start(

      {
        facingMode:"environment"
      },

      {
        fps:10,

        qrbox:{
          width:280,
          height:140
        },

        aspectRatio:1.777778

      },

      function(codigo){

        if(scannerRodando){

          scannerRodando = false;

          processarCodigo(codigo);

        }

      },

      function(){

      }

    );


    scannerRodando = true;


    document.getElementById(
      "status"
    ).textContent =
      "Aponte a câmera para o código de barras.";


  }catch(error){

    console.error(
      "Erro ao abrir câmera:",
      error
    );


    scanner = null;

    scannerRodando = false;


    document.getElementById(
      "scannerArea"
    ).style.display =
      "none";


    document.getElementById(
      "scanButton"
    ).style.display =
      "block";


    document.getElementById(
      "status"
    ).textContent =
      "";


    alert(
      "Não foi possível abrir a câmera.\n\n" +
      "Verifique se o Safari possui permissão para usar a câmera."
    );

  }

}


async function fecharScanner(){

  const scannerAtual =
    scanner;


  scanner = null;

  scannerRodando = false;


  if(scannerAtual){

    try{

      await scannerAtual.stop();

    }catch(error){

      console.log(
        "Câmera já estava parada.",
        error
      );

    }


    try{

      scannerAtual.clear();

    }catch(error){

      console.log(
        "Scanner já estava limpo.",
        error
      );

    }

  }


  document.getElementById(
    "scannerArea"
  ).style.display =
    "none";


  document.getElementById(
    "scanButton"
  ).style.display =
    "block";


  document.getElementById(
    "status"
  ).textContent =
    "";

}


/* =========================================================
   PROCESSAR CÓDIGO
========================================================= */

async function processarCodigo(codigo){

  codigo =
    String(codigo).trim();


  await fecharScanner();


  if(!codigo){

    return;

  }


  if(!supermercadoAtual){

    alert(
      "Selecione um supermercado primeiro."
    );

    return;

  }


  const {
    data: produtos,
    error
  } =
    await supabaseClient
      .from("produtos")
      .select("*")
      .eq(
        "codigo_barras",
        codigo
      )
      .order(
        "id",
        {
          ascending:true
        }
      )
      .limit(1);


  if(error){

    console.error(error);

    alert(
      "Erro ao consultar o produto."
    );

    return;

  }


  /* =======================================================
     PRODUTO NOVO
  ======================================================= */

  if(
    !produtos ||
    produtos.length === 0
  ){

    abrirModalNovoProduto(codigo);

    return;

  }


  const produto =
    produtos[0];


  /* =======================================================
     BUSCA ÚLTIMO PREÇO
  ======================================================= */

  const {
    data: precos,
    error: erroPreco
  } =
    await supabaseClient
      .from("precos")
      .select("*")
      .eq(
        "produto_id",
        produto.id
      )
      .eq(
        "supermercado_id",
        supermercadoAtual
      )
      .order(
        "registrado_em",
        {
          ascending:false
        }
      )
      .limit(1);


  if(erroPreco){

    console.error(erroPreco);

    alert(
      "Erro ao consultar o preço."
    );

    return;

  }


  let ultimoPreco = "";


  if(
    precos &&
    precos.length > 0
  ){

    ultimoPreco =
      Number(
        precos[0].preco
      ).toFixed(2);

  }


  /*
    Aqui está a alteração principal:

    Mesmo que já exista preço cadastrado,
    ele será colocado em um campo EDITÁVEL.
  */

  produtoAtual = {

    id:
      produto.id,

    codigo_barras:
      produto.codigo_barras,

    nome:
      produto.nome,

    preco:
      ultimoPreco

  };


  mostrarProduto();

}


/* =========================================================
   MOSTRAR PRODUTO
========================================================= */

function mostrarProduto(){

  if(!produtoAtual){

    return;

  }


  document.getElementById(
    "produtoNome"
  ).textContent =
    produtoAtual.nome;


  document.getElementById(
    "produtoPreco"
  ).value =
    produtoAtual.preco;


  document.getElementById(
    "produtoCodigo"
  ).textContent =
    "Código: " +
    produtoAtual.codigo_barras;


  document.getElementById(
    "produtoCard"
  ).classList.remove(
    "hidden"
  );


  setTimeout(
    function(){

      document.getElementById(
        "produtoPreco"
      ).focus();

    },
    150
  );

}


function esconderProduto(){

  document.getElementById(
    "produtoCard"
  ).classList.add(
    "hidden"
  );

}


/* =========================================================
   NOVO PRODUTO
========================================================= */

function abrirModalNovoProduto(codigo){

  document.getElementById(
    "novoProdutoCodigo"
  ).value =
    codigo;


  document.getElementById(
    "novoProdutoNome"
  ).value =
    "";


  document.getElementById(
    "novoProdutoPreco"
  ).value =
    "";


  document.getElementById(
    "produtoModal"
  ).style.display =
    "flex";


  setTimeout(
    function(){

      document.getElementById(
        "novoProdutoNome"
      ).focus();

    },
    200
  );

}


function fecharModalProduto(){

  document.getElementById(
    "produtoModal"
  ).style.display =
    "none";

}


/* =========================================================
   CADASTRAR PRODUTO NOVO
========================================================= */

async function cadastrarProduto(){

  const codigo =
    document.getElementById(
      "novoProdutoCodigo"
    ).value.trim();


  const nome =
    document.getElementById(
      "novoProdutoNome"
    ).value.trim();


  const preco =
    Number(
      document.getElementById(
        "novoProdutoPreco"
      ).value
    );


  if(!nome){

    alert(
      "Digite o nome do produto."
    );

    return;

  }


  if(
    !Number.isFinite(preco) ||
    preco < 0
  ){

    alert(
      "Digite um preço válido."
    );

    return;

  }


  const {
    data: produto,
    error: erroProduto
  } =
    await supabaseClient
      .from("produtos")
      .insert({

        codigo_barras:
          codigo,

        nome:
          nome

      })
      .select()
      .single();


  if(erroProduto){

    console.error(erroProduto);

    alert(
      "Não foi possível cadastrar o produto."
    );

    return;

  }


  const {
    error: erroPreco
  } =
    await supabaseClient
      .from("precos")
      .insert({

        produto_id:
          produto.id,

        supermercado_id:
          supermercadoAtual,

        preco:
          preco

      });


  if(erroPreco){

    console.error(erroPreco);

    alert(
      "Produto cadastrado, mas houve erro ao salvar o preço."
    );

    return;

  }


  fecharModalProduto();


  produtoAtual = {

    id:
      produto.id,

    codigo_barras:
      codigo,

    nome:
      nome,

    preco:
      preco

  };


  mostrarProduto();

}


/* =========================================================
   SALVAR PREÇO E ADICIONAR AO CARRINHO
========================================================= */

async function salvarPrecoEAdicionar(){

  if(!produtoAtual){

    return;

  }


  const campoPreco =
    document.getElementById(
      "produtoPreco"
    );


  const preco =
    Number(
      campoPreco.value
    );


  if(
    !Number.isFinite(preco) ||
    preco < 0
  ){

    alert(
      "Digite um preço válido."
    );

    campoPreco.focus();

    return;

  }


  if(!supermercadoAtual){

    alert(
      "Selecione um supermercado."
    );

    return;

  }


  const botao =
    document.getElementById(
      "adicionarProdutoButton"
    );


  botao.disabled = true;

  botao.textContent =
    "Salvando...";


  /*
    SEMPRE registramos o preço informado.

    Dessa forma:

    R$ 6,00 ontem
    R$ 6,49 hoje

    ficam preservados no histórico.
  */

  const {
    error
  } =
    await supabaseClient
      .from("precos")
      .insert({

        produto_id:
          produtoAtual.id,

        supermercado_id:
          supermercadoAtual,

        preco:
          preco

      });


  if(error){

    console.error(error);

    alert(
      "Não foi possível salvar o preço."
    );

    botao.disabled = false;

    botao.textContent =
      "Salvar preço e adicionar ao carrinho";

    return;

  }


  /*
    Atualiza o preço atual do produto
    antes de colocá-lo no carrinho.
  */

  produtoAtual.preco =
    preco;


  adicionarAoCarrinhoComProdutoAtual();


  botao.disabled = false;

  botao.textContent =
    "Salvar preço e adicionar ao carrinho";

}


/* =========================================================
   ADICIONAR AO CARRINHO
========================================================= */

function adicionarAoCarrinhoComProdutoAtual(){

  if(!produtoAtual){

    return;

  }


  const existente =
    carrinho.find(
      item =>
        Number(item.produto_id) ===
        Number(produtoAtual.id)
    );


  if(existente){

    /*
      Se o produto já estiver no carrinho,
      mantemos a quantidade existente e
      atualizamos o preço para o preço
      informado nesta leitura.
    */

    existente.preco_unitario =
      Number(produtoAtual.preco);

    existente.quantidade += 1;

  }else{

    carrinho.push({

      produto_id:
        produtoAtual.id,

      codigo_barras:
        produtoAtual.codigo_barras,

      nome:
        produtoAtual.nome,

      preco_unitario:
        Number(produtoAtual.preco),

      quantidade:
        1

    });

  }


  salvarCarrinho();

  renderizarCarrinho();


  produtoAtual = null;

  esconderProduto();

}


/* =========================================================
   CARRINHO
========================================================= */

function renderizarCarrinho(){

  const container =
    document.getElementById(
      "carrinho"
    );


  if(carrinho.length === 0){

    container.innerHTML =
      '<div class="empty">Nenhum produto adicionado.</div>';


    document.getElementById(
      "limparCarrinhoButton"
    ).style.display =
      "none";


    document.getElementById(
      "finalizarButton"
    ).disabled =
      true;


    atualizarTotal();

    return;

  }


  container.innerHTML = "";


  carrinho.forEach(
    function(item,index){

      const subtotal =
        Number(item.preco_unitario) *
        Number(item.quantidade);


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "cart-item";


      div.innerHTML = `

        <div class="cart-left">

          <div class="cart-name">
            ${escaparHTML(item.nome)}
          </div>

          <div class="cart-price">
            ${formatarMoeda(item.preco_unitario)}
            cada
          </div>

        </div>


        <div class="cart-right">

          <div class="subtotal">
            ${formatarMoeda(subtotal)}
          </div>


          <div class="qty">

            <button
              onclick="alterarQuantidade(${index},-1)"
            >
              −
            </button>

            <span>
              ${item.quantidade}
            </span>

            <button
              onclick="alterarQuantidade(${index},1)"
            >
              +
            </button>

          </div>

        </div>

      `;


      container.appendChild(div);

    }
  );


  document.getElementById(
    "limparCarrinhoButton"
  ).style.display =
    "block";


  document.getElementById(
    "finalizarButton"
  ).disabled =
    false;


  atualizarTotal();

}


function alterarQuantidade(index,delta){

  if(!carrinho[index]){

    return;

  }


  carrinho[index].quantidade +=
    delta;


  if(
    carrinho[index].quantidade <= 0
  ){

    carrinho.splice(
      index,
      1
    );

  }


  salvarCarrinho();

  renderizarCarrinho();

}


function calcularTotal(){

  return carrinho.reduce(
    function(total,item){

      return total +
        (
          Number(
            item.preco_unitario
          ) *
          Number(
            item.quantidade
          )
        );

    },
    0
  );

}


function atualizarTotal(){

  document.getElementById(
    "total"
  ).textContent =
    formatarMoeda(
      calcularTotal()
    );

}


/* =========================================================
   LOCAL STORAGE
========================================================= */

function salvarCarrinho(){

  localStorage.setItem(
    STORAGE_CARRINHO,
    JSON.stringify(carrinho)
  );


  if(carrinho.length > 0){

    if(
      !localStorage.getItem(
        STORAGE_DATA
      )
    ){

      localStorage.setItem(
        STORAGE_DATA,
        Date.now().toString()
      );

    }

  }else{

    localStorage.removeItem(
      STORAGE_DATA
    );

  }

}


function restaurarCarrinho(){

  const dados =
    localStorage.getItem(
      STORAGE_CARRINHO
    );


  const dataCriacao =
    localStorage.getItem(
      STORAGE_DATA
    );


  if(!dados){

    carrinho = [];

    renderizarCarrinho();

    return;

  }


  if(dataCriacao){

    const idade =
      Date.now() -
      Number(dataCriacao);


    const limite =
      STORAGE_HORAS *
      60 *
      60 *
      1000;


    if(idade > limite){

      localStorage.removeItem(
        STORAGE_CARRINHO
      );

      localStorage.removeItem(
        STORAGE_DATA
      );

      carrinho = [];

      renderizarCarrinho();

      return;

    }

  }


  try{

    carrinho =
      JSON.parse(dados);


    if(
      !Array.isArray(carrinho)
    ){

      carrinho = [];

    }

  }catch(error){

    carrinho = [];

  }


  renderizarCarrinho();

}


function limparCarrinhoSilencioso(){

  carrinho = [];

  localStorage.removeItem(
    STORAGE_CARRINHO
  );

  localStorage.removeItem(
    STORAGE_DATA
  );

  renderizarCarrinho();

}


function limparCarrinho(){

  if(carrinho.length === 0){

    return;

  }


  const confirmar =
    confirm(
      "Deseja realmente limpar todo o carrinho?"
    );


  if(!confirmar){

    return;

  }


  limparCarrinhoSilencioso();

}


/* =========================================================
   FINALIZAR COMPRA
========================================================= */

async function finalizarCompra(){

  if(carrinho.length === 0){

    return;

  }


  if(!supermercadoAtual){

    alert(
      "Selecione um supermercado."
    );

    return;

  }


  const confirmar =
    confirm(
      "Finalizar esta compra?\n\n" +
      "Total: " +
      formatarMoeda(
        calcularTotal()
      )
    );


  if(!confirmar){

    return;

  }


  const button =
    document.getElementById(
      "finalizarButton"
    );


  button.disabled = true;

  button.textContent =
    "Salvando...";


  const total =
    calcularTotal();


  const {
    data: compra,
    error: erroCompra
  } =
    await supabaseClient
      .from("compras")
      .insert({

        supermercado_id:
          supermercadoAtual,

        total:
          total

      })
      .select()
      .single();


  if(erroCompra){

    console.error(erroCompra);

    alert(
      "Não foi possível salvar a compra."
    );

    button.disabled = false;

    button.textContent =
      "Finalizar compra";

    return;

  }


  const itens =
    carrinho.map(
      function(item){

        return {

          compra_id:
            compra.id,

          produto_id:
            item.produto_id,

          quantidade:
            item.quantidade,

          preco_unitario:
            item.preco_unitario,

          subtotal:
            Number(
              item.preco_unitario
            ) *
            Number(
              item.quantidade
            )

        };

      }
    );


  const {
    error: erroItens
  } =
    await supabaseClient
      .from("itens_compra")
      .insert(itens);


  if(erroItens){

    console.error(erroItens);

    alert(
      "A compra foi criada, mas houve erro ao salvar os produtos."
    );

    button.disabled = false;

    button.textContent =
      "Finalizar compra";

    return;

  }


  localStorage.removeItem(
    STORAGE_CARRINHO
  );

  localStorage.removeItem(
    STORAGE_DATA
  );


  carrinho = [];

  renderizarCarrinho();


  button.textContent =
    "Compra finalizada ✓";


  await carregarHistorico();


  alert(
    "Compra salva com sucesso!"
  );


  setTimeout(
    function(){

      button.textContent =
        "Finalizar compra";

    },
    2000
  );

}


/* =========================================================
   HISTÓRICO
========================================================= */

async function carregarHistorico(){

  const container =
    document.getElementById(
      "historico"
    );


  const {
    data: compras,
    error
  } =
    await supabaseClient
      .from("compras")
      .select(`
        id,
        data_compra,
        total,
        supermercados (
          nome
        )
      `)
      .order(
        "data_compra",
        {
          ascending:false
        }
      )
      .limit(20);


  if(error){

    console.error(error);

    container.innerHTML =
      '<div class="empty">Não foi possível carregar o histórico.</div>';

    return;

  }


  if(
    !compras ||
    compras.length === 0
  ){

    container.innerHTML =
      '<div class="empty">Nenhuma compra finalizada ainda.</div>';

    return;

  }


  container.innerHTML = "";


  compras.forEach(
    function(compra){

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "history-item";


      const data =
        new Date(
          compra.data_compra
        );


      const dataFormatada =
        data.toLocaleString(
          "pt-BR",
          {
            dateStyle:"short",
            timeStyle:"short"
          }
        );


      const supermercado =
        compra.supermercados
          ? compra.supermercados.nome
          : "Supermercado";


      div.innerHTML = `

        <div class="history-top">

          <div class="history-date">
            ${dataFormatada}
          </div>

          <div class="history-total">
            ${formatarMoeda(compra.total)}
          </div>

        </div>

        <div class="history-market">
          ${escaparHTML(supermercado)}
        </div>

      `;


      container.appendChild(div);

    }
  );

}


/* =========================================================
   UTILITÁRIOS
========================================================= */

function formatarMoeda(valor){

  return Number(
    valor || 0
  ).toLocaleString(
    "pt-BR",
    {
      style:"currency",
      currency:"BRL"
    }
  );

}


function escaparHTML(texto){

  return String(texto)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   FECHAR MODAIS AO CLICAR FORA
========================================================= */

document
  .getElementById(
    "produtoModal"
  )
  .addEventListener(
    "click",
    function(event){

      if(
        event.target === this
      ){

        fecharModalProduto();

      }

    }
  );


document
  .getElementById(
    "supermercadoModal"
  )
  .addEventListener(
    "click",
    function(event){

      if(
        event.target === this
      ){

        fecharModalSupermercado();

      }

    }
  );

</script>
