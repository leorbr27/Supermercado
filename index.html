<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Supermercado</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f4f5f7;
  color:#222;
  padding-bottom:100px;
}
header{
  background:#fff;
  padding:18px 16px 14px;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 1px 6px #0001;
}
h1{margin:0 0 12px;font-size:24px}
label{
  display:block;
  font-size:14px;
  font-weight:600;
  margin-bottom:6px;
}
select,input,button{
  width:100%;
  min-height:46px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
  padding:10px 12px;
  background:#fff;
}
button{
  border:0;
  background:#1677ff;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}
button.secondary{background:#666}
button.success{background:#159447}
button.danger{background:#d93025}
button.small{
  width:auto;
  min-height:38px;
  padding:7px 12px;
  font-size:14px;
}
.container{
  max-width:650px;
  margin:auto;
  padding:14px;
}
.card{
  background:#fff;
  border-radius:14px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 2px 8px #0000000d;
}
#reader{
  width:100%;
  overflow:hidden;
  border-radius:12px;
}
#status{
  text-align:center;
  margin:10px 0;
  font-size:14px;
  color:#666;
}
.product-name{
  font-size:20px;
  font-weight:700;
  margin-bottom:4px;
}
.barcode{
  color:#777;
  font-size:13px;
}
.price{
  font-size:25px;
  font-weight:800;
  margin:12px 0;
}
.row{
  display:flex;
  gap:8px;
  align-items:center;
}
.row>*{flex:1}
.qty{
  display:flex;
  align-items:center;
  gap:8px;
  justify-content:center;
}
.qty button{
  width:42px;
  min-height:42px;
  padding:0;
}
.qty span{
  min-width:35px;
  text-align:center;
  font-size:18px;
  font-weight:700;
}
.cart-item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}
.cart-item:last-child{border-bottom:0}
.cart-info{flex:1}
.cart-total{
  font-weight:800;
  white-space:nowrap;
}
.empty{
  text-align:center;
  color:#777;
  padding:20px 5px;
}
.total-bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  box-shadow:0 -2px 12px #0002;
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  z-index:20;
}
.total-line{
  max-width:650px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.total-label{font-size:14px;color:#666}
.total-value{font-size:25px;font-weight:900}
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:50;
  align-items:flex-end;
  justify-content:center;
}
.modal.show{display:flex}
.modal-box{
  background:#fff;
  width:100%;
  max-width:650px;
  border-radius:20px 20px 0 0;
  padding:20px;
  padding-bottom:calc(20px + env(safe-area-inset-bottom));
}
.modal-box h2{margin-top:0}
.modal-actions{
  display:flex;
  gap:8px;
  margin-top:15px;
}
.modal-actions button{flex:1}
.hidden{display:none!important}
.history-item{
  display:flex;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid #eee;
}
.muted{color:#777;font-size:13px}
</style>
</head>

<body>

<header>
  <h1>🛒 Supermercado</h1>

  <label for="supermercado">Supermercado</label>
  <div class="row">
    <select id="supermercado"></select>
    <button class="small" onclick="novoSupermercado()">＋</button>
  </div>
</header>

<div class="container">

  <div class="card">
    <div id="reader"></div>
    <div id="status">Inicializando câmera...</div>
  </div>

  <div id="produtoCard" class="card hidden"></div>

  <div class="card">
    <h2>🛒 Carrinho</h2>
    <div id="cart"></div>

    <button
      id="finalizarBtn"
      class="success"
      onclick="finalizarCompra()"
      disabled>
      Finalizar e salvar compra
    </button>
  </div>

  <div class="card">
    <h2>📋 Compras anteriores</h2>
    <div id="historico"></div>
  </div>

</div>

<div class="total-bar">
  <div class="total-line">
    <div>
      <div class="total-label">TOTAL DA COMPRA</div>
      <div id="total" class="total-value">R$ 0,00</div>
    </div>
    <button
      class="small secondary"
      onclick="limparCarrinho()">
      Limpar
    </button>
  </div>
</div>


<!-- MODAL PRODUTO -->
<div id="produtoModal" class="modal">
  <div class="modal-box">

    <h2>Produto não cadastrado</h2>

    <p class="muted">
      O código de barras foi encontrado, mas ainda não existe
      cadastro para este supermercado.
    </p>

    <label>Código de barras</label>
    <input id="novoCodigo" readonly>

    <br><br>

    <label>Nome do produto</label>
    <input
      id="novoNome"
      type="text"
      placeholder="Ex.: Arroz 5kg">

    <br><br>

    <label>Preço no supermercado</label>
    <input
      id="novoPreco"
      type="number"
      step="0.01"
      min="0"
      placeholder="0,00">

    <div class="modal-actions">
      <button class="secondary" onclick="fecharModal()">
        Cancelar
      </button>

      <button class="success" onclick="cadastrarProduto()">
        Cadastrar
      </button>
    </div>

  </div>
</div>


<script>
/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const SUPABASE_URL =
  "https://lbehdmxfkakwygwoozyr.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_wJXFi-54JwNO9RIm8NZU_Q_-9bt7S7h";

const supabaseClient =
  supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


/* =========================================================
   ESTADO
========================================================= */

let scanner = null;
let scannerRodando = false;

let produtoAtual = null;
let produtoPendente = null;

let carrinho = [];


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

document.addEventListener("DOMContentLoaded", async () => {

  await carregarSupermercados();

  await carregarHistorico();

  atualizarCarrinho();

  iniciarScanner();

});


/* =========================================================
   SUPERMERCADOS
========================================================= */

async function carregarSupermercados(){

  const select = document.getElementById("supermercado");

  const { data, error } = await supabaseClient
    .from("supermercados")
    .select("*")
    .order("nome");

  if(error){

    console.error(error);

    select.innerHTML =
      `<option>Erro ao carregar</option>`;

    return;
  }

  select.innerHTML = "";

  data.forEach(supermercado => {

    const option = document.createElement("option");

    option.value = supermercado.id;
    option.textContent = supermercado.nome;

    select.appendChild(option);

  });

}


async function novoSupermercado(){

  const nome = prompt(
    "Nome do novo supermercado:"
  );

  if(!nome || !nome.trim()) return;

  const { data, error } = await supabaseClient
    .from("supermercados")
    .insert({
      nome: nome.trim()
    })
    .select()
    .single();

  if(error){

    if(error.code === "23505"){
      alert("Esse supermercado já está cadastrado.");
    }else{
      alert("Erro ao cadastrar supermercado.");
      console.error(error);
    }

    return;
  }

  await carregarSupermercados();

  document.getElementById("supermercado").value =
    data.id;

}


/* =========================================================
   SCANNER
========================================================= */

function iniciarScanner(){

  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },

    {
      fps: 10,
      qrbox: {
        width: 280,
        height: 140
      }
    },

    codigo => {

      if(scannerRodando){
        scannerRodando = false;
        processarCodigo(codigo);
      }

    },

    () => {}

  ).then(() => {

    scannerRodando = true;

    document.getElementById("status").textContent =
      "Aponte a câmera para o código de barras.";

  }).catch(error => {

    console.error(error);

    document.getElementById("status").textContent =
      "Não foi possível acessar a câmera.";

  });

}


/* =========================================================
   PROCESSAR CÓDIGO
========================================================= */

async function processarCodigo(codigo){

  document.getElementById("status").textContent =
    "Consultando produto...";

  const supermercadoId =
    document.getElementById("supermercado").value;

  if(!supermercadoId){

    alert("Selecione um supermercado.");

    scannerRodando = true;

    return;
  }


  /*
     Primeiro procuramos o produto pelo código.
  */

  const { data: produto, error } =
    await supabaseClient
      .from("produtos")
      .select("*")
      .eq("codigo_barras", codigo)
      .limit(1)
      .maybeSingle();


  if(error){

    console.error(error);

    alert("Erro ao consultar o produto.");

    scannerRodando = true;

    return;
  }


  /*
     Produto já existe.
  */

  if(produto){

    await processarProdutoExistente(
      produto,
      supermercadoId
    );

    return;
  }


  /*
     Produto totalmente novo.
  */

  abrirModalNovoProduto(codigo);

}


/* =========================================================
   PRODUTO EXISTENTE
========================================================= */

async function processarProdutoExistente(
  produto,
  supermercadoId
){

  const { data: supermercado } =
    await supabaseClient
      .from("supermercados")
      .select("nome")
      .eq("id", supermercadoId)
      .single();


  /*
     Procurar o último preço registrado
     naquele supermercado.
  */

  const { data: ultimoPreco } =
    await supabaseClient
      .from("precos")
      .select("*")
      .eq("produto_id", produto.id)
      .eq("supermercado_id", supermercadoId)
      .order("registrado_em", {
        ascending:false
      })
      .limit(1)
      .maybeSingle();


  produtoAtual = {

    ...produto,

    supermercado_id: supermercadoId,

    supermercado_nome:
      supermercado?.nome || "",

    preco:
      ultimoPreco?.preco ?? null

  };


  mostrarProduto(produtoAtual);

}


/* =========================================================
   MOSTRAR PRODUTO
========================================================= */

function mostrarProduto(produto){

  const card =
    document.getElementById("produtoCard");

  card.classList.remove("hidden");

  const precoTexto =
    produto.preco !== null
      ? formatarMoeda(produto.preco)
      : "Preço não cadastrado";

  card.innerHTML = `

    <div class="product-name">
      ${escaparHTML(produto.nome)}
    </div>

    <div class="barcode">
      Código: ${escaparHTML(produto.codigo_barras)}
    </div>

    <div class="muted">
      ${escaparHTML(produto.supermercado_nome)}
    </div>

    <div class="price">
      ${precoTexto}
    </div>

    ${
      produto.preco !== null
      ?
      `
      <div class="row">

        <div class="qty">
          <button
            class="small secondary"
            onclick="alterarQuantidadeProduto(-1)">
            −
          </button>

          <span id="qtdProduto">1</span>

          <button
            class="small"
            onclick="alterarQuantidadeProduto(1)">
            +
          </button>
        </div>

        <button
          class="success"
          onclick="adicionarCarrinho()">
          🛒 Adicionar ao carrinho
        </button>

      </div>
      `
      :
      `
      <button onclick="registrarPreco()">
        Informar preço
      </button>
      `
    }

  `;

  window.quantidadeProduto = 1;

}


/* =========================================================
   ALTERAR QUANTIDADE
========================================================= */

function alterarQuantidadeProduto(valor){

  window.quantidadeProduto =
    Math.max(
      1,
      (window.quantidadeProduto || 1) + valor
    );

  const el =
    document.getElementById("qtdProduto");

  if(el){
    el.textContent =
      window.quantidadeProduto;
  }

}


/* =========================================================
   ADICIONAR AO CARRINHO
========================================================= */

async function adicionarCarrinho(){

  if(!produtoAtual) return;

  if(produtoAtual.preco === null){

    alert("Este produto ainda não possui preço.");

    return;
  }


  const quantidade =
    window.quantidadeProduto || 1;


  /*
     Se já existe no carrinho,
     apenas aumenta a quantidade.
  */

  const existente =
    carrinho.find(item =>
      item.produto_id === produtoAtual.id
    );


  if(existente){

    existente.quantidade += quantidade;

  }else{

    carrinho.push({

      produto_id:
        produtoAtual.id,

      codigo_barras:
        produtoAtual.codigo_barras,

      nome:
        produtoAtual.nome,

      preco_unitario:
        Number(produtoAtual.preco),

      quantidade:
        quantidade

    });

  }


  atualizarCarrinho();

  document.getElementById("produtoCard")
    .classList.add("hidden");

  produtoAtual = null;

  window.quantidadeProduto = 1;

  document.getElementById("status").textContent =
    "Produto adicionado. Escaneie o próximo.";

  scannerRodando = true;

}


/* =========================================================
   CARRINHO
========================================================= */

function atualizarCarrinho(){

  const container =
    document.getElementById("cart");

  if(carrinho.length === 0){

    container.innerHTML =
      `<div class="empty">
        O carrinho está vazio.
      </div>`;

  }else{

    container.innerHTML =
      carrinho.map((item,index) => {

        const subtotal =
          item.preco_unitario *
          item.quantidade;

        return `

          <div class="cart-item">

            <div class="cart-info">

              <strong>
                ${escaparHTML(item.nome)}
              </strong>

              <div class="muted">
                ${item.quantidade} ×
                ${formatarMoeda(item.preco_unitario)}
              </div>

              <div class="qty">

                <button
                  class="small secondary"
                  onclick="alterarQuantidadeCarrinho(${index},-1)">
                  −
                </button>

                <span>
                  ${item.quantidade}
                </span>

                <button
                  class="small"
                  onclick="alterarQuantidadeCarrinho(${index},1)">
                  +
                </button>

                <button
                  class="small danger"
                  onclick="removerCarrinho(${index})">
                  ×
                </button>

              </div>

            </div>

            <div class="cart-total">
              ${formatarMoeda(subtotal)}
            </div>

          </div>

        `;

      }).join("");

  }


  const total =
    calcularTotal();

  document.getElementById("total")
    .textContent =
      formatarMoeda(total);


  document.getElementById("finalizarBtn")
    .disabled =
      carrinho.length === 0;

}


function calcularTotal(){

  return carrinho.reduce(
    (total,item) =>
      total +
      item.preco_unitario *
      item.quantidade,
    0
  );

}


function alterarQuantidadeCarrinho(
  index,
  valor
){

  carrinho[index].quantidade += valor;

  if(carrinho[index].quantidade <= 0){

    carrinho.splice(index,1);

  }

  atualizarCarrinho();

}


function removerCarrinho(index){

  carrinho.splice(index,1);

  atualizarCarrinho();

}


function limparCarrinho(){

  if(carrinho.length === 0) return;

  if(!confirm(
    "Deseja realmente limpar o carrinho?"
  )){
    return;
  }

  carrinho = [];

  atualizarCarrinho();

}


/* =========================================================
   FINALIZAR COMPRA
========================================================= */

async function finalizarCompra(){

  if(carrinho.length === 0){

    alert("O carrinho está vazio.");

    return;
  }


  const supermercadoId =
    document.getElementById("supermercado").value;


  if(!supermercadoId){

    alert("Selecione um supermercado.");

    return;
  }


  const total =
    calcularTotal();


  /*
     1. Criar a compra.
  */

  const { data: compra, error } =
    await supabaseClient
      .from("compras")
      .insert({

        supermercado_id:
          supermercadoId,

        total:
          total

      })
      .select()
      .single();


  if(error){

    console.error(error);

    alert("Erro ao salvar a compra.");

    return;
  }


  /*
     2. Salvar cada item.
  */

  const itens =
    carrinho.map(item => ({

      compra_id:
        compra.id,

      produto_id:
        item.produto_id,

      quantidade:
        item.quantidade,

      preco_unitario:
        item.preco_unitario,

      subtotal:
        item.preco_unitario *
        item.quantidade

    }));


  const { error: erroItens } =
    await supabaseClient
      .from("itens_compra")
      .insert(itens);


  if(erroItens){

    console.error(erroItens);

    alert(
      "A compra foi criada, mas houve erro ao salvar os itens."
    );

    return;
  }


  alert(
    "Compra salva com sucesso!\n\n" +
    "Total: " +
    formatarMoeda(total)
  );


  carrinho = [];

  atualizarCarrinho();

  await carregarHistorico();

}


/* =========================================================
   REGISTRAR PREÇO
========================================================= */

async function registrarPreco(){

  if(!produtoAtual) return;

  const valor =
    prompt(
      "Digite o preço atual do produto:"
    );

  if(valor === null) return;

  const preco =
    Number(
      valor.replace(",", ".")
    );


  if(isNaN(preco) || preco < 0){

    alert("Digite um preço válido.");

    return;
  }


  const { error } =
    await supabaseClient
      .from("precos")
      .insert({

        produto_id:
          produtoAtual.id,

        supermercado_id:
          produtoAtual.supermercado_id,

        preco:
          preco

      });


  if(error){

    console.error(error);

    alert("Erro ao registrar preço.");

    return;
  }


  produtoAtual.preco = preco;

  mostrarProduto(produtoAtual);

}


/* =========================================================
   CADASTRAR PRODUTO NOVO
========================================================= */

function abrirModalNovoProduto(codigo){

  produtoPendente = codigo;

  document.getElementById("novoCodigo")
    .value = codigo;

  document.getElementById("novoNome")
    .value = "";

  document.getElementById("novoPreco")
    .value = "";

  document.getElementById("produtoModal")
    .classList.add("show");

}


function fecharModal(){

  document.getElementById("produtoModal")
    .classList.remove("show");

  produtoPendente = null;

  scannerRodando = true;

}


async function cadastrarProduto(){

  const nome =
    document.getElementById("novoNome")
      .value.trim();

  const preco =
    Number(
      document.getElementById("novoPreco")
        .value
    );

  const codigo =
    produtoPendente;


  if(!nome){

    alert("Digite o nome do produto.");

    return;
  }


  if(isNaN(preco) || preco < 0){

    alert("Digite um preço válido.");

    return;
  }


  /*
     1. Criar produto.
  */

  const { data: produto, error } =
    await supabaseClient
      .from("produtos")
      .insert({

        codigo_barras:
          codigo,

        nome:
          nome

      })
      .select()
      .single();


  if(error){

    console.error(error);

    alert("Erro ao cadastrar produto.");

    return;
  }


  /*
     2. Registrar preço.
  */

  const supermercadoId =
    document.getElementById("supermercado").value;


  const { error: erroPreco } =
    await supabaseClient
      .from("precos")
      .insert({

        produto_id:
          produto.id,

        supermercado_id:
          supermercadoId,

        preco:
          preco

      });


  if(erroPreco){

    console.error(erroPreco);

    alert(
      "Produto cadastrado, mas houve erro ao salvar o preço."
    );

    return;
  }


  /*
     3. Fechar e mostrar produto.
  */

  fecharModal();

  await processarProdutoExistente(
    produto,
    supermercadoId
  );

}


/* =========================================================
   HISTÓRICO DE COMPRAS
========================================================= */

async function carregarHistorico(){

  const container =
    document.getElementById("historico");


  const { data, error } =
    await supabaseClient
      .from("compras")
      .select(`
        id,
        data_compra,
        total,
        supermercados (
          nome
        )
      `)
      .order("data_compra", {
        ascending:false
      })
      .limit(10);


  if(error){

    console.error(error);

    container.innerHTML =
      `<div class="muted">
        Não foi possível carregar o histórico.
      </div>`;

    return;
  }


  if(!data || data.length === 0){

    container.innerHTML =
      `<div class="empty">
        Nenhuma compra salva ainda.
      </div>`;

    return;
  }


  container.innerHTML =
    data.map(compra => {

      const dataCompra =
        new Date(compra.data_compra)
          .toLocaleString("pt-BR");


      return `

        <div class="history-item">

          <div>

            <strong>
              Compra #${compra.id}
            </strong>

            <div class="muted">
              ${escaparHTML(
                compra.supermercados?.nome || ""
              )}
            </div>

            <div class="muted">
              ${dataCompra}
            </div>

          </div>

          <strong>
            ${formatarMoeda(compra.total)}
          </strong>

        </div>

      `;

    }).join("");

}


/* =========================================================
   UTILITÁRIOS
========================================================= */

function formatarMoeda(valor){

  return Number(valor)
    .toLocaleString(
      "pt-BR",
      {
        style:"currency",
        currency:"BRL"
      }
    );

}


function escaparHTML(texto){

  return String(texto)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
