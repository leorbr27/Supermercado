<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Supermercado</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#f4f6f8;
  color:#1f2937;
}

.container{
  width:100%;
  max-width:700px;
  margin:0 auto;
  padding:16px;
  padding-bottom:110px;
}

h1{
  margin:5px 0 18px;
  font-size:27px;
  text-align:center;
}

h2{
  font-size:20px;
  margin:22px 0 12px;
}

.card{
  background:white;
  border-radius:16px;
  padding:16px;
  margin-bottom:15px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}

label{
  display:block;
  font-size:14px;
  font-weight:600;
  margin-bottom:6px;
}

select,
input{
  width:100%;
  height:48px;
  border:1px solid #d1d5db;
  border-radius:10px;
  padding:0 13px;
  font-size:16px;
  background:white;
}

.row{
  display:flex;
  gap:8px;
  align-items:center;
}

.row select{
  flex:1;
  min-width:0;
}

/* BOTÃO + PEQUENO E QUADRADO */
.row > button.small{
  flex:0 0 46px;
  width:46px;
  min-width:46px;
  height:46px;
  padding:0;
  border-radius:10px;
  font-size:25px;
}

button{
  border:0;
  border-radius:11px;
  min-height:46px;
  padding:0 16px;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.primary{
  width:100%;
  background:#111827;
  color:white;
}

.secondary{
  background:#e5e7eb;
  color:#111827;
}

.danger{
  background:#fee2e2;
  color:#b91c1c;
}

.success{
  background:#16a34a;
  color:white;
}

.small{
  font-size:14px;
}

#scannerArea{
  display:none;
  margin-top:15px;
}

#reader{
  width:100%;
  overflow:hidden;
  border-radius:14px;
  background:#111;
}

#reader video{
  width:100% !important;
  height:auto !important;
  border-radius:14px;
}

#status{
  text-align:center;
  font-size:14px;
  color:#6b7280;
  margin:10px 0;
  min-height:20px;
}

.product-info{
  background:#f8fafc;
  border-radius:12px;
  padding:14px;
  margin-top:14px;
}

.product-name{
  font-size:19px;
  font-weight:700;
  margin-bottom:7px;
}

.price{
  font-size:25px;
  font-weight:800;
}

.barcode{
  color:#6b7280;
  font-size:13px;
  margin-top:5px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:13px 0;
  border-bottom:1px solid #e5e7eb;
}

.cart-item:last-child{
  border-bottom:0;
}

.cart-left{
  flex:1;
  min-width:0;
}

.cart-name{
  font-weight:650;
  line-height:1.25;
}

.cart-price{
  color:#6b7280;
  font-size:14px;
  margin-top:4px;
}

.cart-right{
  text-align:right;
  min-width:105px;
}

.subtotal{
  font-weight:750;
}

.qty{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:7px;
  margin-top:6px;
}

.qty button{
  width:30px;
  min-width:30px;
  height:30px;
  min-height:30px;
  padding:0;
  border-radius:8px;
  background:#e5e7eb;
  font-size:18px;
}

.qty span{
  min-width:20px;
  text-align:center;
  font-weight:700;
}

.empty{
  text-align:center;
  color:#6b7280;
  padding:18px 5px;
}

.total-bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  border-top:1px solid #e5e7eb;
  box-shadow:0 -3px 15px rgba(0,0,0,.08);
  padding:12px 16px;
  z-index:100;
}

.total-inner{
  width:100%;
  max-width:700px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.total-label{
  font-size:14px;
  color:#6b7280;
}

.total-value{
  font-size:26px;
  font-weight:850;
}

.total-bar button{
  min-width:150px;
}

.history-item{
  padding:13px 0;
  border-bottom:1px solid #e5e7eb;
}

.history-item:last-child{
  border-bottom:0;
}

.history-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.history-date{
  font-weight:650;
}

.history-total{
  font-weight:800;
}

.history-market{
  font-size:14px;
  color:#6b7280;
  margin-top:4px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:200;
  padding:20px;
  align-items:center;
  justify-content:center;
}

.modal-box{
  width:100%;
  max-width:500px;
  background:white;
  border-radius:18px;
  padding:20px;
  max-height:90vh;
  overflow:auto;
}

.modal-title{
  font-size:21px;
  font-weight:800;
  margin-bottom:16px;
}

.field{
  margin-bottom:15px;
}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:18px;
}

.modal-actions button{
  flex:1;
}

.loading{
  opacity:.65;
  pointer-events:none;
}

.notice{
  font-size:13px;
  color:#6b7280;
  line-height:1.45;
  margin-top:8px;
}

.hidden{
  display:none !important;
}

@media(max-width:500px){

  .container{
    padding:12px;
    padding-bottom:115px;
  }

  h1{
    font-size:25px;
  }

  .card{
    padding:14px;
    border-radius:14px;
  }

  .total-inner{
    gap:8px;
  }

  .total-value{
    font-size:23px;
  }

  .total-bar button{
    min-width:135px;
    padding:0 12px;
  }

}

</style>

</head>

      Supermercado
    </label>
