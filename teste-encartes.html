<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173b63">
<title>Teste de encartes · Supermercado</title>
<style>
:root{color-scheme:light;--blue:#173b63;--blue2:#24578b;--bg:#f2f5f9;--line:#dfe7f0;--muted:#63748a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#182538;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:18px 14px 42px}header{display:flex;align-items:center;gap:12px;margin-bottom:18px}header a{font-size:28px;color:var(--blue);text-decoration:none}h1{font-size:clamp(22px,4vw,29px);margin:0;color:var(--blue)}.sub{color:var(--muted);font-size:14px;margin-top:4px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 3px 12px #1e466e08}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.metric{background:#f5f8fc;border-radius:12px;padding:12px}.metric strong{display:block;font-size:22px;color:var(--blue)}.metric span{font-size:12px;color:var(--muted)}
.controls{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}label{display:block;font-size:12px;font-weight:700;color:#4b5d73;margin-bottom:6px}input,select{width:100%;min-height:43px;padding:10px 11px;border:1px solid #cbd6e3;border-radius:10px;background:#fff;color:#182538;font-size:15px}
.status{font-size:14px;line-height:1.5;color:var(--muted);padding:5px 0}.status.error{color:#b42318}.table-wrap{overflow-x:auto;margin-top:12px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid #e7edf4;vertical-align:top}th{background:#f5f8fc;color:#43566d;font-size:12px;white-space:nowrap}tbody tr:hover{background:#fafcff}.price{font-weight:750;color:#087443;white-space:nowrap}.store{font-weight:650}.empty{text-align:center;padding:28px 10px;color:var(--muted)}.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:12px}
@media(max-width:650px){.wrap{padding:14px 10px 30px}.summary{gap:7px}.metric{padding:10px 8px}.metric strong{font-size:19px}.metric span{font-size:11px}.controls{grid-template-columns:1fr}.card{padding:12px}table{font-size:13px}th,td{padding:9px 8px}}
</style>
</head>
<body><main class="wrap">
<header><a href="index.html" aria-label="Voltar à página inicial">‹</a><div><h1>🛒 Teste de encartes</h1><div class="sub">Consulta automática dos preços registrados no arquivo JSON do GitHub.</div></div></header>
<section class="card"><div class="summary">
<div class="metric"><strong id="total">—</strong><span>Produtos registrados</span></div>
<div class="metric"><strong id="stores">—</strong><span>Supermercados</span></div>
<div class="metric"><strong id="shown">—</strong><span>Resultados exibidos</span></div>
</div><div id="status" class="status" role="status" aria-live="polite">Carregando os preços registrados…</div></section>
<section class="card">
<div class="controls">
<div><label for="search">Buscar produto ou descrição</label><input id="search" type="search" placeholder="Ex.: arroz, café, frango…"></div>
<div><label for="storeFilter">Supermercado</label><select id="storeFilter"><option value="">Todos os supermercados</option></select></div>
<div><label for="sort">Ordenar por</label><select id="sort"><option value="store">Supermercado</option><option value="name">Nome do produto</option><option value="low">Menor preço</option><option value="high">Maior preço</option></select></div>
</div>
<div class="table-wrap"><table><thead><tr><th>Supermercado</th><th>Produto</th><th>Peso / quantidade</th><th>Preço</th></tr></thead><tbody id="products"><tr><td colspan="4" class="empty">Carregando dados…</td></tr></tbody></table></div>
<div class="bottom"><span id="resultInfo">Aguardando o arquivo JSON.</span><button id="reload" type="button">↻ Atualizar dados</button></div>
</section>
</main>
<script>
const JSON_URL="precos-registrados.json";
const $=id=>document.getElementById(id);
let allProducts=[];
const money=value=>Number(value).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
function setStatus(message,error=false){$("status").textContent=message;$("status").className="status"+(error?" error":"")}
function escapeHtml(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function loadProducts(){
 $("reload").disabled=true;setStatus("Lendo automaticamente precos-registrados.json…");
 try{
  const response=await fetch(JSON_URL+"?t="+Date.now(),{cache:"no-store"});
  if(!response.ok)throw new Error("Não foi possível acessar o arquivo JSON (HTTP "+response.status+").");
  const data=await response.json();
  if(!Array.isArray(data))throw new Error("O arquivo JSON precisa conter uma lista de produtos.");
  allProducts=data.filter(p=>p&&typeof p==="object").map(p=>({
   supermercado:String(p.supermercado??"Não informado"),
   descricao:String(p.descricao??"Produto sem descrição"),
   peso_quantidade:String(p.peso_quantidade??"—"),
   preco:Number(p.preco)
  })).filter(p=>Number.isFinite(p.preco)&&p.preco>=0);
  const stores=[...new Set(allProducts.map(p=>p.supermercado))].sort((a,b)=>a.localeCompare(b,"pt-BR"));
  const previous=$("storeFilter").value;
  $("storeFilter").innerHTML='<option value="">Todos os supermercados</option>'+stores.map(s=>'<option value="'+escapeHtml(s)+'">'+escapeHtml(s)+'</option>').join("");
  if(stores.includes(previous))$("storeFilter").value=previous;
  $("total").textContent=allProducts.length.toLocaleString("pt-BR");
  $("stores").textContent=stores.length.toLocaleString("pt-BR");
  setStatus("Arquivo JSON carregado com sucesso. Os dados são lidos diretamente do repositório do GitHub.");
  renderProducts();
 }catch(error){
  allProducts=[];$("total").textContent="0";$("stores").textContent="0";$("shown").textContent="0";
  $("products").innerHTML='<tr><td colspan="4" class="empty">Não foi possível carregar os produtos.</td></tr>';
  $("resultInfo").textContent="Verifique se precos-registrados.json existe e contém JSON válido.";
  setStatus(error.message||"Erro ao carregar o arquivo JSON.",true);
 }finally{$("reload").disabled=false}
}
function renderProducts(){
 const term=$("search").value.trim().toLocaleLowerCase("pt-BR"),store=$("storeFilter").value,sort=$("sort").value;
 let rows=allProducts.filter(p=>(!store||p.supermercado===store)&&(!term||(p.supermercado+" "+p.descricao+" "+p.peso_quantidade).toLocaleLowerCase("pt-BR").includes(term)));
 rows.sort((a,b)=>sort==="low"?a.preco-b.preco:sort==="high"?b.preco-a.preco:sort==="name"?a.descricao.localeCompare(b.descricao,"pt-BR"):a.supermercado.localeCompare(b.supermercado,"pt-BR")||a.descricao.localeCompare(b.descricao,"pt-BR"));
 $("shown").textContent=rows.length.toLocaleString("pt-BR");
 $("products").innerHTML=rows.length?rows.map(p=>'<tr><td class="store">'+escapeHtml(p.supermercado)+'</td><td>'+escapeHtml(p.descricao)+'</td><td>'+escapeHtml(p.peso_quantidade)+'</td><td class="price">'+money(p.preco)+'</td></tr>').join(""):'<tr><td colspan="4" class="empty">Nenhum produto encontrado para esses filtros.</td></tr>';
 $("resultInfo").textContent="Exibindo "+rows.length.toLocaleString("pt-BR")+" de "+allProducts.length.toLocaleString("pt-BR")+" produtos.";
}
$("search").addEventListener("input",renderProducts);$("storeFilter").addEventListener("change",renderProducts);$("sort").addEventListener("change",renderProducts);$("reload").addEventListener("click",loadProducts);
loadProducts();
</script></body></html>
