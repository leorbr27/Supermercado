<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Consultar produtos — Supermercado</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.container{max-width:900px;margin:auto;padding:16px 16px 40px}header{display:flex;align-items:center;gap:10px;margin:4px 0 16px}.back{border:0;background:#e8f0fb;color:#2456a6;border-radius:11px;width:44px;height:44px;font-size:22px}.subtitle,.note,.date,.code{color:#68778d;font-size:13px}.card,.product{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px rgba(30,70,110,.07);border:1px solid #e7edf5}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f4f8fd;border-radius:13px;padding:12px;text-align:center;border:1px solid #e3ebf5}.stat b{display:block;font-size:22px;color:#2456a6}.stat span{font-size:12px;color:#68778d}.controls{display:grid;grid-template-columns:1.4fr 1fr;gap:9px}input,select{width:100%;height:46px;border:1px solid #cfd9e6;border-radius:11px;padding:0 12px;font-size:16px;background:#fff;color:#172033}input:focus,select:focus{outline:3px solid rgba(37,99,235,.12);border-color:#5b8def}.toolbar{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px}.clear{border:0;background:#eef3f8;color:#29415f;border-radius:10px;padding:8px 11px;font-weight:600}.product{padding:0;overflow:hidden}.product-head{padding:14px;background:#f4f8fd;border-bottom:1px solid #e5edf6}.name{font-weight:750;font-size:17px;color:#183b63}.rows{padding:0 14px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #edf0f2}.row:last-child{border-bottom:0}.market{font-weight:600}.price{font-size:18px;font-weight:800;white-space:nowrap;color:#1f4169}.lowest{color:#11845a}.badge{font-size:10px;background:#dff7eb;color:#11744f;padding:3px 6px;border-radius:20px;margin-left:5px}.empty{text-align:center;color:#68778d;padding:25px 5px}.loading{text-align:center;padding:28px;color:#68778d}.error{background:#fff1f2;color:#9f1239;border-radius:12px;padding:16px;line-height:1.45}@media(max-width:600px){.controls{grid-template-columns:1fr}.stat b{font-size:19px}}</style>
</head>
<body>
<div class="container">
<header><button class="back" onclick="location.href='index.html'" aria-label="Voltar">‹</button><div><h1 style="font-size:25px;margin:0">📋 Consultar produtos</h1><div class="subtitle">Produtos, supermercados e preços registrados</div></div></header>
<div class="card"><div class="stats"><div class="stat"><b id="totalProdutos">—</b><span>Produtos</span></div><div class="stat"><b id="totalMercados">—</b><span>Supermercados</span></div><div class="stat"><b id="totalPrecos">—</b><span>Registros de preços</span></div></div></div>
<div class="card">
<div class="controls"><input id="busca" type="search" autocomplete="off" placeholder="🔎 Produto ou código de barras"><select id="mercado"><option value="">Todos os supermercados</option></select></div>
<div style="margin-top:9px"><select id="ordenacao"><option value="nome">Ordenar: produto (A–Z)</option><option value="menor">Ordenar: menor preço</option><option value="maior">Ordenar: maior preço</option><option value="recente">Ordenar: atualização mais recente</option></select></div>
<div class="note" style="margin-top:10px">Para cada produto, é mostrado o preço mais recente de cada supermercado. O histórico permanece no banco.</div>
</div>
<div class="card"><div class="toolbar"><strong id="contador">Carregando...</strong><button class="clear" id="limpar">Limpar filtros</button></div><div id="lista"><div class="loading">Carregando produtos e preços...</div></div></div>
</div>
<script>
const URL="https://lbehdmxfkakwygwoozyr.supabase.co";
const KEY="sb_publishable_wJXFi-54JwNO9RIm8NZU_Q_-9bt7S7h";
const API=URL+"/rest/v1";
const headers={apikey:KEY,Authorization:"Bearer "+KEY};
let produtos=[],mercados=[],precos=[];
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function moeda(v){return Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});}
function data(v){return v?new Date(v).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}):"—";}
async function api(path){
 const r=await fetch(API+path,{headers,cache:"no-store"});
 const txt=await r.text();
 if(!r.ok) throw new Error("Supabase "+r.status+": "+txt);
 try{return JSON.parse(txt)}catch(e){throw new Error("Resposta inválida do banco.");}
}
async function carregar(){
 $("lista").innerHTML='<div class="loading">Carregando produtos e preços...</div>';
 try{
  const [p,m,r]=await Promise.all([
   api("/produtos?select=id,nome,codigo_barras,ativo&ativo=eq.true&order=nome.asc"),
   api("/supermercados?select=id,nome&order=nome.asc"),
   api("/precos?select=id,produto_id,supermercado_id,preco,registrado_em&order=registrado_em.desc&limit=10000")
  ]);
  produtos=Array.isArray(p)?p:[];mercados=Array.isArray(m)?m:[];precos=Array.isArray(r)?r:[];
  $("totalProdutos").textContent=produtos.length;$("totalMercados").textContent=mercados.length;$("totalPrecos").textContent=precos.length;
  $("mercado").innerHTML='<option value="">Todos os supermercados</option>'+mercados.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.nome)+'</option>').join("");
  renderizar();
 }catch(e){
  console.error("Erro consulta:",e);$("contador").textContent="Erro ao carregar";
  $("lista").innerHTML='<div class="error"><strong>Não foi possível acessar o banco de dados.</strong><br>'+esc(e.message||"Erro desconhecido")+'<br><br>O problema foi identificado na conexão com o Supabase.</div>';
 }
}
function renderizar(){
 const termo=$("busca").value.trim().toLocaleLowerCase("pt-BR"),mercado=$("mercado").value,ordem=$("ordenacao").value;
 const mMap=new Map(mercados.map(x=>[String(x.id),x.nome])),latest=new Map();
 for(const x of precos){const k=String(x.produto_id)+"|"+String(x.supermercado_id);if(!latest.has(k))latest.set(k,x);}
 const arr=[];
 for(const p of produtos){
  if(termo&&!String(p.nome||"").toLocaleLowerCase("pt-BR").includes(termo)&&!String(p.codigo_barras||"").includes(termo))continue;
  const rows=[...latest.values()].filter(x=>String(x.produto_id)===String(p.id)&&(!mercado||String(x.supermercado_id)===String(mercado))).map(x=>({...x,nomeMercado:mMap.get(String(x.supermercado_id))||"Supermercado"}));
  if(mercado&&!rows.length)continue;rows.sort((a,b)=>Number(a.preco)-Number(b.preco));arr.push({produto:p,rows});
 }
 arr.sort((a,b)=>ordem==="menor"?(a.rows.length?Number(a.rows[0].preco):Infinity)-(b.rows.length?Number(b.rows[0].preco):Infinity):ordem==="maior"?(b.rows.length?Number(b.rows[0].preco):-Infinity)-(a.rows.length?Number(a.rows[0].preco):-Infinity):ordem==="recente"?new Date(b.rows[0]?.registrado_em||0)-new Date(a.rows[0]?.registrado_em||0):String(a.produto.nome).localeCompare(String(b.produto.nome),"pt-BR"));
 $("contador").textContent=arr.length+" produto"+(arr.length===1?"":"s")+" encontrado"+(arr.length===1?"":"s");
 if(!arr.length){$("lista").innerHTML='<div class="empty">Nenhum produto encontrado com os filtros atuais.</div>';return;}
 $("lista").innerHTML=arr.map(g=>{const menor=g.rows.length?Math.min(...g.rows.map(x=>Number(x.preco))):null;let linhas=g.rows.map(x=>{const low=menor!==null&&Number(x.preco)===menor;return '<div class="row"><div><div class="market">'+esc(x.nomeMercado)+(low?'<span class="badge">menor preço</span>':'')+'</div><div class="date">Atualizado em '+esc(data(x.registrado_em))+'</div></div><div class="price '+(low?"lowest":"")+'">'+moeda(x.preco)+'</div></div>';}).join("");if(!linhas)linhas='<div class="empty">Nenhum preço registrado.</div>';return '<div class="product"><div class="product-head"><div class="name">'+esc(g.produto.nome)+'</div><div class="code">Código de barras: '+esc(g.produto.codigo_barras||"—")+'</div></div><div class="rows">'+linhas+'</div></div>';}).join("");
}
$("busca").addEventListener("input",renderizar);$("mercado").addEventListener("change",renderizar);$("ordenacao").addEventListener("change",renderizar);
$("limpar").addEventListener("click",()=>{$("busca").value="";$("mercado").value="";$("ordenacao").value="nome";renderizar();});
carregar();
</script>
</body>
</html>
