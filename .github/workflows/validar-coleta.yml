name: Validar automação de ofertas
on:
  push:
    branches: [feature/coleta-automatica-22-redes]
    paths:
      - "automation/**"
      - "api/geminiofertas/index.mjs"
      - ".github/workflows/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JavaScript syntax
        run: node --check api/geminiofertas/index.mjs
      - name: Validate Python syntax and source registry
        run: |
          python -m py_compile automation/collect_offers.py
          python - <<'PY'
          import json
          d=json.load(open("automation/fontes.json",encoding="utf-8"))
          assert len(d["sources"]) == 22, len(d["sources"])
          assert d["confidence_rules"] == {"auto_approve_min":95,"manual_review_min":60,"reject_below":60}
          assert len({x["id"] for x in d["sources"]}) == 22
          print("22 sources; confidence thresholds OK")
          PY
