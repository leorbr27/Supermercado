name: Bundle Neon Function

on:
  push:
    branches: [main]
    paths:
      - "api/geminiofertas/index.mjs"
      - "api/geminiofertas/package.json"
      - ".github/workflows/bundle-neon-function.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      HAS_NEON_API_KEY: ${{ secrets.NEON_API_KEY != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install bundler and API dependency
        working-directory: api/geminiofertas
        run: npm install --no-save --ignore-scripts --package-lock=false esbuild @neondatabase/serverless@^0.9.0
      - name: Bundle and validate function
        working-directory: api/geminiofertas
        run: |
          mkdir -p dist
          ./node_modules/.bin/esbuild index.mjs --bundle --platform=node --format=esm --target=node24 --outfile=dist/index.mjs
          node --check dist/index.mjs
          cd dist
          zip -q ../geminiofertas.zip index.mjs
      - name: Upload deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: geminiofertas-bundle
          path: api/geminiofertas/geminiofertas.zip
          if-no-files-found: error
          retention-days: 1
      - name: Install Neon CLI
        if: ${{ env.HAS_NEON_API_KEY == 'true' }}
        run: npm install --global neon
      - name: Deploy function to Neon
        if: ${{ env.HAS_NEON_API_KEY == 'true' }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: neon function deploy geminiofertas --src api/geminiofertas --project-id young-cherry-46155901 --branch br-wandering-resonance-b4w2m30c --api-key "$NEON_API_KEY"
      - name: Smoke test public API
        if: ${{ env.HAS_NEON_API_KEY == 'true' }}
        run: |
          status=$(curl --retry 8 --retry-delay 3 --retry-all-errors -sS -o /tmp/neon-response.json -w "%{http_code}" "https://br-wandering-resonance-b4w2m30c-geminiofertas.compute.c-6.us-east-2.aws.neon.tech/")
          echo "HTTP_STATUS=$status"
          cat /tmp/neon-response.json
          test "$status" = "200"
          node -e "const d=require('/tmp/neon-response.json'); if(!Array.isArray(d)) process.exit(1); console.log('JSON_ARRAY_OK; COUNT='+d.length)"
      - name: Record deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$HAS_NEON_API_KEY" != "true" ]; then
            DEPLOY_STATUS="skipped_no_neon_api_key"
          elif [ "$JOB_STATUS" = "success" ]; then
            DEPLOY_STATUS="completed_http_200"
          else
            DEPLOY_STATUS="failed"
          fi
          printf '{\n  "status": "%s",\n  "checked_at": "%s",\n  "commit": "%s"\n}\n' "$DEPLOY_STATUS" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_SHA" > api/geminiofertas/deploy-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git add api/geminiofertas/deploy-status.json
          git commit -m "Registrar status do deploy Neon [skip ci]" || exit 0
          git push
