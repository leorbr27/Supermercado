name: Build bundled Neon function
# Deployment smoke check runs after the source bundle is committed.
# The one-off write smoke test validates upsert and localized currency parsing.
on:
  push:
    branches: [main]
    paths:
      - "api/neon-function/index.mjs"
      - "api/neon-function/package.json"
      - ".github/workflows/build-neon-function.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: api/neon-function
        run: npm install --no-audit --no-fund
      - name: Bundle dependencies into a single file
        run: |
          npx --yes esbuild api/neon-function/index.mjs --bundle --platform=node --format=cjs --target=node24 --outfile=api/neon-function/deploy/index.cjs
          { printf '%s\n' 'import { createRequire } from "node:module";' 'const require = createRequire(import.meta.url);' 'const module = { exports: {} };' 'const exports = module.exports;'; cat api/neon-function/deploy/index.cjs; printf '\nexport default module.exports.default;\n'; } > api/neon-function/deploy/index.mjs
      - name: Commit deployable bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/neon-function/deploy/index.mjs api/neon-function/deploy/index.cjs
          if git diff --cached --quiet; then
            echo "Bundle is already up to date."
          else
            git commit -m "Build bundled Neon function"
            git push origin main
          fi
      - name: Smoke test active Neon API read endpoint
        run: |
          curl --max-time 20 --retry 2 --retry-delay 2 --retry-all-errors -fsS "https://br-wandering-resonance-b4w2m30c-geminiofertas.compute.c-6.us-east-2.aws.neon.tech/" | jq -e 'type == "array"' >/dev/null
      - name: Smoke test public offer write and localized price parsing
        run: |
          url="https://br-wandering-resonance-b4w2m30c-geminiofertas.compute.c-6.us-east-2.aws.neon.tech/"
          signature="__SMOKE_TEST_20261022T0902Z__"
          curl --max-time 20 -fsS -X POST "$url" -H "Origin: https://leorbr27.github.io" -H "Content-Type: application/json" --data '{"store":"__SMOKE_TEST__","product":"__SMOKE_TEST__","package":"Não informada","price":"R$ 12,90","signature":"__SMOKE_TEST_20261022T0902Z__","dados_originais":{"marca":"Não informada"}}' | jq -e '.success == true and .saved == 1' >/dev/null
          curl --max-time 20 -fsS "$url" | jq -e 'any(.[]; .assinatura == "__SMOKE_TEST_20261022T0902Z__" and (.preco|tonumber) == 12.9)' >/dev/null
