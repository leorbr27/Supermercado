name: Build bundled Neon function
on:
  push:
    branches: [main]
    paths:
      - "api/neon-function/index.mjs"
      - "api/neon-function/package.json"
      - ".github/workflows/build-neon-function.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: api/neon-function
        run: npm install --no-audit --no-fund
      - name: Bundle dependencies into a single file
        run: npx --yes esbuild api/neon-function/index.mjs --bundle --platform=node --format=esm --target=node24 --outfile=api/neon-function/deploy/index.mjs
      - name: Commit deployable bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/neon-function/deploy/index.mjs
          if git diff --cached --quiet; then
            echo "Bundle is already up to date."
          else
            git commit -m "Build bundled Neon function"
            git push origin main
          fi
